services:
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /data/adrobot.sqlite3
      LOG_FILE: /logs/app.log
      SERVICE_NAME: ${SERVICE_NAME:-adrobot}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - adrobot_data:/data
      - adrobot_logs:/logs
    restart: unless-stopped
  loki:
    image: grafana/loki:3.5.7
    user: "0:0"
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.2
    command: run --disable-reporting --storage.path=/var/lib/alloy /etc/alloy/config.alloy
    environment:
      SERVICE_NAME: ${SERVICE_NAME:-adrobot}
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - adrobot_logs:/var/log/adrobot:ro
      - alloy_data:/var/lib/alloy
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/adrobot-logs.json
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  adrobot_data:
  adrobot_logs:
  loki_data:
  alloy_data:
  grafana_data:
